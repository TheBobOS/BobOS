# BobOS — menu BIOS (syslinux)
# cow_spacesize=4G : l'overlay du live passe de 256 Mo (défaut archiso) à
# 4 Go. C'est un tmpfs : la RAM n'est consommée qu'à l'usage. Sans ça, Firefox,
# Steam ou Docker remplissent l'overlay et le live hurle « No space left ».
#
# Entrées « speech » retirées : accessibility=on ne servait à rien sans
# espeakup/livecd-talk dans l'image (elles ne faisaient rien du tout).
#
# console=tty0 console=ttyS0,115200 : tty0 DOIT rester la première console,
# sinon tout le message part sur le port série et l'écran VGA reste noir (sur
# une vraie machine, sans câble série, on ne voit plus rien). La ligne série
# est un bonus : le log complet du boot est visible dans un terminal, ce qui
# sauve le diagnostic en VM ou à distance.
#
# systemd.mask=systemd-firstboot.service : le live n'a pas de fuseau horaire
# défini, donc systemd-firstboot ouvre son assistant et ATTEND une saisie. Or il
# est ordonné AVANT sysinit.target : sans réponse, le boot s'arrête là — pas de
# getty, pas de bureau, écran noir (constaté puis reproduit en VM). Un système
# éphémère ne pose pas de question au démarrage. Ce masque est propre au live :
# sur la cible installée, l'installateur a déjà défini langue et fuseau.

# Défaut : noyau Arch stock → boot automatique sur TOUS les PC (aucun choix)
LABEL arch
TEXT HELP
Boot BobOS (normal). Works on every PC, no AVX2 required.
Selected automatically after the timeout.
ENDTEXT
MENU LABEL BobOS install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G console=tty0 console=ttyS0,115200 systemd.mask=systemd-firstboot.service

# XanMod : pour les CPU récents (AVX2 / 2013+), plus rapide
LABEL archxanmod
TEXT HELP
Boot BobOS with the XanMod kernel (needs AVX2, CPU 2013+).
Use this for better performance on recent hardware.
ENDTEXT
MENU LABEL BobOS (%ARCH%, BIOS) — XanMod (^CPU récent)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-xanmod
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-xanmod.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G console=tty0 console=ttyS0,115200 systemd.mask=systemd-firstboot.service
