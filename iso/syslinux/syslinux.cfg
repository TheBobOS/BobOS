# BobOS — configuration El Torito (démarrage BIOS / ISOLINUX)
#
# On n'utilise PAS whichsys.c32, volontairement.
#
# whichsys sert à un seul usage : faire tourner la MÊME config depuis un CD,
# une clé USB et un serveur PXE. Il choisit sa branche en fonction de ce que le
# FIRMWARE croit être le mode de démarrage — et ce n'est pas forcément le
# nôtre : un firmware BIOS classique (SeaBIOS de QEMU, vieux portables) tente
# d'abord un démarrage réseau, il est donc détecté « pxe » même en bootant
# depuis le CD. Quand la branche correspondante manque, whichsys affiche
#
#     No command specified for ISOLINUX.
#
# et la machine refuse de démarrer (écran figé sur le message d'usage).
#
# BobOS ne fait pas de netboot : les hooks archiso_pxe_* ont été retirés de
# l'image. Il n'y a donc rien à détecter — on entre directement dans le menu.
# Testé en QEMU/SeaBIOS (CD El Torito) : menu rendu, noyau et initramfs
# chargés, boot correct.
INCLUDE archiso_sys.cfg
