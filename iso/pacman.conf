[options]
# Cache dédié au build : le cache host contient des paquets Artix de mêmes
# noms/versions que les paquets Arch (223 collisions) → signatures invalides.
# Chemin non-par-défaut → mkarchiso le garde tel quel.
CacheDir    = /var/tmp/bobos-pkgcache/
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
CheckSpace
VerbosePkgLists
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

# bob-core EN DERNIER : les paquets identiques vont à extra (cohérents et
# complets — ex: pipewire avec ses splits libpipewire/pipewire-audio).
# bob-core ne sert que ses paquets uniques (xanmod, p10k…) et gagne toujours
# quand sa version est supérieure.
[multilib]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[bob-core]
SigLevel = Never
Server = https://bob.xem.yt/os/x86_64
