[options]
# Cache dédié au build : le cache host contient des paquets Artix de mêmes
# noms/versions que les paquets Arch (223 collisions) → signatures invalides.
# Chemin non-par-défaut → mkarchiso le garde tel quel.
CacheDir    = /var/tmp/bobos-pkgcache/
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
CheckSpace
VerbosePkgLists
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

# Dépôt LOCAL du build : Calamares n'existe pas dans les dépôts Arch, il est
# compilé par build.sh puis servi ici en file://. Il passe EN PREMIER pour que
# ce soit sa version qui soit installée. SigLevel=Optional (pas de Never :
# on n'ajoute pas de dépôt non vérifié à l'ISO).
[bobos-local]
SigLevel = Optional
Server = file:///var/tmp/bobos-localrepo

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

# bob-core EN DERNIER, et la vraie règle (corrigée après audit) :
# pacman choisit la version LA PLUS HAUTE parmi tous les dépôts ; l'ordre ne
# départage que les égalités de version. Donc :
#   - bob-core plus récent qu'extra  → bob-core gagne, même en dernier ;
#   - versions identiques            → extra gagne (bob-core est après) ;
#   - bob-core plus ancien          → extra gagne, quoi qu'il arrive.
# C'est exactement ce qu'on veut : bob-core ne sert que ses paquets uniques
# (linux-xanmod, p10k…) et ses vrais bumps, jamais ses copies obsolètes
# (c'est ainsi qu'un pipewire 1.6.8 sans ses splits ne peut plus casser le
# build).
[multilib]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

# ⚠ Le dépôt qui fournit le NOYAU n'est pas signé (SigLevel = Never) : une
# compromission de bob.xem.yt, ou un domaine racheté, se traduirait par un
# paquet root sur chaque machine au prochain bob-update. À corriger : signer le
# dépôt et publier un paquet bobos-keyring (voir RAPPORT-AUDIT.md, SEC-02).
[bob-core]
SigLevel = Never
Server = https://bob.xem.yt/os/x86_64
