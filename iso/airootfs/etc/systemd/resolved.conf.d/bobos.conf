# BobOS — DNS privé par défaut : Quad9 chiffré (DoT)
# opportuniste : chiffre dès que le 853 passe, redescend en clair si le
# FAI bloque le port → JAMAIS de résolution morte (sinon : chargement infini
# sur les sites jamais visités, Google qui "marche" grâce au cache).
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::fe::fe#dns.quad9.net
FallbackDNS=9.9.9.9 149.112.112.112 1.1.1.1
DNSOverTLS=opportunistic
DNSSEC=yes
Domains=~.
LLMNR=no
MulticastDNS=no
