# BobOS — DNS privé : Quad9, chiffrement opportuniste.
#
# Corrections (audit NET-03) :
#  - « 2620:fe::fe::fe » n'était PAS une adresse IPv6 valide (deux « :: ») ;
#    la bonne adresse Quad9 v6 est 2620:fe::9.
#  - pas de Domains=~. : cela envoyait TOUTES les requêtes vers Quad9 et
#    cassait les noms locaux (box.lan, NAS, intranet) et les portails captifs.
#    Sans ~., systemd-resolved utilise Quad9 comme DNS principal mais garde
#    les serveurs du réseau pour leurs domaines locaux.
#  - DNSSEC=allow-downgrade : strict, ça casse tout si l'horloge dérive.
#  - le NTP est activé (systemd-timesyncd) pour que DNSSEC ait une heure juste.
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
FallbackDNS=9.9.9.9 149.112.112.112 1.1.1.1
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
LLMNR=no
MulticastDNS=no
Cache=yes
