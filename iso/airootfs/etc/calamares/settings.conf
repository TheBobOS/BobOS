# BobOS — Calamares (installateur hors-ligne, profil inspiré d'EndeavourOS)
---
modules-search: [ local ]

instances:
    - id:       mountiso
      module:   shellprocess
      config:   shellprocess_mountiso.conf

    - id:       fixes
      module:   shellprocess
      config:   shellprocess_fixes.conf

sequence:
    - show:
        - welcome
        # langue + fuseau horaire (avant : tout en UTC, LANG non défini)
        - locale
        # clavier (avant : AZERTY imposé à tout le monde)
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - shellprocess@mountiso
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - users
        - hwclock
        - services-systemd
        - shellprocess@fixes
        - grubcfg
        - bootloader
        - umount
    - show:
        - finished

branding: bobos

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: true

hide-back-and-next-during-exec: true

quit-at-end: false
