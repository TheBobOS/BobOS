# BobOS — services systemd activés sur la cible après installation.
# Le live a ses propres services (NetworkManager, docker…) ; ici on décide de
# ce qui sera activé sur le système installé.
# Les services déjà activés par le live restent activés : c'est
# enable_over_enabling qui compte ici.
---
overwrite: false
units:
    - NetworkManager.service
    - systemd-timesyncd.service
    - fstrim.timer
    - reflector.timer
    - nftables.service
