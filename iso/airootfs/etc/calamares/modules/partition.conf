# BobOS — partitionnement : « Effacer le disque » présélectionné (disque au choix)
---
# ESP UEFI montée en /boot/efi (BIOS : ignorée, table msdos auto)
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    512MiB
    minimumSize:        300MiB
    label:              "EFI"

# swap : aucune par défaut, l'utilisateur peut choisir
userSwapChoices:
    - none
    - small
    - file

# le meilleur disque interne reste à choisir dans la page, mais le mode
# « Effacer » est présélectionné (demande utilisateur)
initialPartitioningChoice: erase
initialSwapChoice: none

drawNestedPartitions:   false
alwaysShowPartitionLabels: true

defaultFileSystemType:  "ext4"

# BobOS : ext4 uniquement, pas de LVM
lvm:
    enable: false

# Chiffrement LUKS2 proposé, DÉCOCHÉ par défaut (l'installateur reste simple
# pour qui ne veut pas réfléchir, mais la case existe).
enableLuksAutomatedPartitioning: true
luksFormatFilesystem: luks2

# ne pas démonter le live ni Ventoy pendant le clear des mounts
essentialMounts: [ "live-*", "control", "ventoy" ]
