# BobOS — corrections dans le chroot cible (après users, avant bootloader)
# ${USER} = nom d'utilisateur saisi sur la page users (expansion Calamares)
---
dontChroot: false

# mkinitcpio -P sur 2 kernels + vieux disque : large
timeout: 900

verbose: true

script:
    - "/usr/bin/bobos-target-fixes ${USER}"
