# BobOS — page d'accueil (100% hors-ligne : pas de geoip, pas de réseau)
---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false

requirements:
    # La racine décompressée fait ~9,3 Go (noyaux + initramfs + les deux
    # régénérations de mkinitcpio) : annoncer 8 Go laissait l'install échouer
    # en plein milieu.
    requiredStorage:    20
    requiredRam:        2.0

    check:
        - storage
        - ram
        - root
        - screen

    required:
        - storage
        - ram
        - root
