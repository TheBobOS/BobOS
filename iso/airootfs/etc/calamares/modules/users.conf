# BobOS — utilisateur + hôte
---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
    - rfkill

# sudoersGroup désactivé : /etc/sudoers.d/bobos (NOPASSWD wheel) embarqué
# dans l'image fait foi — pas de doublon 10-installer.
# sudoersGroup: wheel

# pas de display manager : l'autologin tty1 est géré par le dropin getty
# réécrit par bobos-target-fixes vers l'utilisateur choisi ici.
displayAutologin: false
doAutologin: false

setRootPassword: true
doReusePassword: true

# Mots de passe : on garde la case « mot de passe faible » DISPONIBLE, mais
# elle est décochée par défaut et 6 caractères sont exigés (avant : minLength
# -1 + minlen=0 = mot de passe vide accepté).
passwordRequirements:
    minLength: 6
    maxLength: -1
    libpwquality:
        - minlen=6
        - minclass=0

allowWeakPasswords: true
allowWeakPasswordsDefault: false

user:
    shell: /usr/bin/zsh
    forbidden_names: [ root ]
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "bobos"
    forbidden_names: [ localhost ]

allowActiveDirectory: false

presets:
    fullName:
        value: "Bob"
        editable: true
    loginName:
        value: "bob"
        editable: true
