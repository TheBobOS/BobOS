# BobOS — /etc/default/grub sur la cible.
# keepDistributor: false → le module remplace « GRUB_DISTRIBUTOR="Arch" »
# par le nom de l'OS détecté (BobOS), sinon le menu GRUB affiche « Arch ».
---
overwrite: false
keep_distributor: false
always_use_defaults: false
prefer_grub_default: true
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_DISABLE_RECOVERY: true
    GRUB_DISABLE_OS_PROBER: false
    GRUB_GFXMODE: "auto"
    GRUB_TERMINAL: "gfxterm console"
