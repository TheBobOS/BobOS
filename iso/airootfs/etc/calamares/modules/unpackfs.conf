# BobOS — déballage du sfs live + copie des kernels/initramfs
# (le sfs ne contient PAS /boot : mkarchiso les extrait dans arch/boot/x86_64/)
---
unpack:
    -   source: /run/archiso/bootmnt/arch/x86_64/airootfs.sfs
        sourcefs: squashfs
        destination: /
        weight: 20
    -   source: /run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux
        sourcefs: file
        destination: /boot/vmlinuz-linux
        weight: 1
    -   source: /run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux-xanmod
        sourcefs: file
        destination: /boot/vmlinuz-linux-xanmod
        weight: 1
    -   source: /run/archiso/bootmnt/arch/boot/x86_64/initramfs-linux.img
        sourcefs: file
        destination: /boot/initramfs-linux.img
        weight: 1
    -   source: /run/archiso/bootmnt/arch/boot/x86_64/initramfs-linux-xanmod.img
        sourcefs: file
        destination: /boot/initramfs-linux-xanmod.img
        weight: 1
