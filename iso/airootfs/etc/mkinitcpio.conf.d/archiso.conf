# BobOS — hooks de l'initramfs du LIVE.
# - hooks archiso_pxe_* retirés : ils exigeaient « nbd-client », absent, et le
#   build finissait en « ERROR: binary not found: nbd-client » (l'initramfs
#   était signalé incomplet). Le PXE ne servait à rien : buildmodes=('iso').
# - « memdisk » retiré aussi : il lui faut « pv », également absent.
# - zstd au lieu de xz -9e : le live démarre nettement plus vite sur les
#   anciennes machines, et l'initramfs est plus petit.
HOOKS=(base udev microcode modconf kms archiso archiso_loop_mnt block filesystems keyboard)
# zstd :supported par mkinitcpio 42 (c'est même son défaut) et bien plus
# rapide à décompresser que xz sur une vieille machine.
COMPRESSION="zstd"
