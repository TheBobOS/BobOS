# BobOS — kitty
# Police Nerd Font : sans elle, p10k (mode nerdfont-v3) et eza --icons
# affichent des carrés vides.
font_family      MesloLGS Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Une police Nerd Font = le curseur en barre mate déjà inclus : rien à faire.

# terminals_scroll_on_output : indispensable pour que `bob-say` / figlet
# défilent proprement
term           xterm-kitty
scrollback     10000
scroll_on_output          true
scroll_on_input           true
mouse                         hide
confirm_os_exit            true
copy_on_select             no
url_handler                default
bell                        none
background_opacity         0.96
window_padding             6 8 6 8

# onglet « BobOS » plutôt que « kitty »
tab_title              BobOS
window_title           BobOS
