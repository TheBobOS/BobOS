# BobOS — extinction et verrouillage automatiques.
# Installé dans le dossier de config de l'utilisateur, lancé par
# hl.on("hyprland.start") dans hyprland.lua.
# Syntaxe hypridle : un bloc `listener` par délai, timeout en SECONDES.

general {
    lock_cmd = pidof hyprlock || hyprlock     -- évite 2 instances de hyprlock
    before_sleep_cmd = loginctl lock-session  -- verrouiller avant veille
    # Hyprland 0.56 : nouvelle syntaxe de dispatch ; l'ancienne reste en repli
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' 2>/dev/null || hyprctl dispatch dpms on
}

# Avertissement avant de verrouiller (5 min)
listener {
    timeout = 240
    on-timeout = notify-send -u critical -t 60000 "BobOS" "Verrouillage dans 1 minute…"
    on-resume = true
}

# Verrouillage (5 min d'inactivité)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Éteindre l'écran (10 min) — l'ordre compte : on verrouille AVANT
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })' 2>/dev/null || hyprctl dispatch dpms off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' 2>/dev/null || hyprctl dispatch dpms on
}

# Mise en veille (30 min)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
